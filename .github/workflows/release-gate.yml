name: Production release gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run historical-baseline-validation
      - run: npm run verify:complete-edition-c1c33
      - run: npm run verify:complete-edition-c1c34
      - run: npm run verify:complete-edition-c1c35
      - run: npm run verify:complete-edition-c1c35r1
      - run: npm run verify:complete-edition-c1c35r2
