name: Production release gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --reporter=json --outputFile=tmp-c1c38-final-tests.json
      - run: npm run build
      - run: npm run historical-baseline-validation
      - run: npm run verify:immutable-phase-baselines
      - run: npm run verify:necromancer-successor-compatibility
      - run: npm run verify:prophet-successor-compatibility
      - run: npm run verify:boss-successor-compatibility
      - run: npm run verify:prophet-gate-a
      - run: npm run verify:complete-edition-c1c35r2a
      - run: npm run verify:complete-edition-c1c35r2b
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:complete-edition-c1c36
      - run: npm run test:e2e:built-bundle-successor
      - run: npm run verify:complete-edition-c1c37
      - run: npm run verify:complete-edition-c1c38
