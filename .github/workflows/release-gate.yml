name: Production release gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:complete-edition-c1c38
      - run: npm run verify:complete-edition-c1c38r1
      - run: npm run verify:complete-edition-c2a
      - run: npm run verify:complete-edition-c2a-r1
      - run: npm run verify:complete-edition-c2b
      - run: npx playwright install --with-deps chromium
      - run: npm run validate:complete-edition-c2e
      - run: node scripts/audit/verify-c2a-test-report.mjs pw-out/c2e-vitest-full.json
      - run: npm run test:e2e:hero-production-player-path
      - run: npm run audit:complete-edition-c2e
      - run: npm run verify:complete-edition-c2e
      - run: npm run verify:prophet-gate-a
      - run: npm run verify:complete-edition-c1c35r2a
      - run: npm run verify:complete-edition-c1c35r2b
      - run: npm run verify:complete-edition-c1c36
      - run: npm run verify:complete-edition-c1c37
      - name: Preserve C2E validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2e-validation-${{ github.sha }}
          path: |
            docs/data/complete-edition/c2e-*.json
            pw-out/c2e-validation.json
            pw-out/c2e-vitest-full.json
            pw-out/c2e-playwright-report.json
            pw-out/c2e-browser-run-binding.json
            pw-out/c2e-browser-checkpoints.jsonl
            pw-out/c2e-browser-network.jsonl
            pw-out/c2e-validation-*.log
            pw-out/c2e-browser.log
            dist/c2d-runtime-module-graph.json
          if-no-files-found: error
