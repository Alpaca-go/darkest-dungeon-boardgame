name: Development Fast Gate
on:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Select development workstream
        id: workstream
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          phase=c3
          if [[ "$BRANCH_NAME" =~ (^|[-/])c4([^/-]*)(-|$) ]]; then
            phase="c4${BASH_REMATCH[2]}"
          fi
          case "$phase" in
            c3|c4a|c4b|c4c) echo "phase=$phase" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported C4 workstream: $phase" >&2; exit 1 ;;
          esac
      - run: npm run verify:complete-edition-c3c
        if: ${{ steps.workstream.outputs.phase == 'c3' }}
      - run: npm run test:complete-edition-c3d
        if: ${{ steps.workstream.outputs.phase == 'c3' }}
      - run: npm run verify:complete-edition-c3d
        if: ${{ steps.workstream.outputs.phase == 'c3' }}
      - run: npm run test:complete-edition-c3e
        if: ${{ steps.workstream.outputs.phase == 'c3' }}
      - run: npm run verify:complete-edition-c3e
        if: ${{ steps.workstream.outputs.phase == 'c3' }}
      - name: Verify C3E at the authoritative C4A base
        if: ${{ steps.workstream.outputs.phase == 'c4a' }}
        shell: bash
        run: |
          base_worktree="$RUNNER_TEMP/c4a-c3e-base"
          git worktree add --detach "$base_worktree" ed84d1359907268736b7d163b68c5b359c4d71fd
          trap 'git worktree remove --force "$base_worktree"' EXIT
          (
            cd "$base_worktree"
            npm ci
            npm run verify:complete-edition-c3e
          )
      - run: npm run test:complete-edition-c4a
        if: ${{ steps.workstream.outputs.phase == 'c4a' }}
      - run: npm run verify:complete-edition-c4a
        if: ${{ steps.workstream.outputs.phase == 'c4a' }}
      - name: Verify C4A at the accepted C4B base
        if: ${{ steps.workstream.outputs.phase == 'c4b' }}
        shell: bash
        run: |
          base_worktree="$RUNNER_TEMP/c4b-c4a-base"
          git worktree add --detach "$base_worktree" 8ac3de01c53dc23b47a9549cb8e219d4c93ff968
          trap 'git worktree remove --force "$base_worktree"' EXIT
          (
            cd "$base_worktree"
            npm ci
            npm run verify:complete-edition-c4a
          )
      - run: npm run test:complete-edition-c4b
        if: ${{ steps.workstream.outputs.phase == 'c4b' }}
      - run: npm run verify:complete-edition-c4b
        if: ${{ steps.workstream.outputs.phase == 'c4b' }}
      - name: Verify C4B at the accepted C4C base
        if: ${{ steps.workstream.outputs.phase == 'c4c' }}
        shell: bash
        run: |
          base_worktree="$RUNNER_TEMP/c4c-c4b-base"
          git worktree add --detach "$base_worktree" 56dd2dc1d863fc02f781aeaa57441351c3921225
          trap 'git worktree remove --force "$base_worktree"' EXIT
          (
            cd "$base_worktree"
            npm ci
            npm run verify:complete-edition-c4b
          )
      - run: npm run test:complete-edition-c4c
        if: ${{ steps.workstream.outputs.phase == 'c4c' }}
      - run: npm run verify:complete-edition-c4c
        if: ${{ steps.workstream.outputs.phase == 'c4c' }}
      - run: npm run build
